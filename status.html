<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>服务器状态</title><style>
html,body{margin:0;height:100%;background:transparent;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#d9f2e4}
body{min-height:100%;display:flex;overflow:hidden}
.wrap{flex:1;background:linear-gradient(165deg,rgba(15,52,35,.96),rgba(9,30,22,.98));border:1px solid rgba(240,179,92,.45);border-radius:16px;padding:16px 16px 14px;box-sizing:border-box;backdrop-filter:blur(10px);box-shadow:0 12px 34px rgba(0,0,0,.42)}
.h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ava{width:46px;height:46px;border-radius:10px;image-rendering:pixelated;background:rgba(255,255,255,.08);border:1px solid rgba(139,199,166,.3);flex:0 0 auto}
.ava.ph{width:46px;height:46px;border-radius:10px;background:linear-gradient(145deg,#3d6b4f,#1f3b2b);display:inline-block;flex:0 0 auto}
.nm{font-size:15px;font-weight:800;line-height:1.3}
.nm .s{display:block;font-size:10px;letter-spacing:.16em;opacity:.5;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;vertical-align:-1px}
.on{background:#3ddc84;box-shadow:0 0 12px #3ddc84}
.off{background:#ff5d5d;box-shadow:0 0 12px #ff5d5d}
.unk{background:#93a39a;box-shadow:none}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.row:last-of-type{border-bottom:0}
.k{opacity:.7;font-size:12.5px}
.v{font-weight:700}
.big{font-size:24px;font-weight:800}
.desc{margin-top:12px;padding:10px 12px;background:rgba(240,179,92,.07);border:1px solid rgba(240,179,92,.3);border-radius:10px;font-size:15px;line-height:1.55;text-align:center}
.rainbow{background:linear-gradient(90deg,#ff6b6b,#ffb86b,#ffe66b,#6bff9e,#6bb7ff,#c56bff,#ff6b6b);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;font-weight:800;animation:rain 3.5s linear infinite}
@keyframes rain{to{background-position:200% center}}
</style><style id="skin-star-cat">
/* ============ 皮肤：星轨滚动条 · 小黑猫光标 · 进入黑猫 ============ */
/* 原生滚动条：把默认白条换成一条垂下来的星轨 */
@supports not (selector(::-webkit-scrollbar)){
  html{scrollbar-width:thin;scrollbar-color:#E4AA5C rgba(8,12,10,.92)}
}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{
  background:linear-gradient(90deg,#050907,#0C1210 42%,#070C0A);
  box-shadow:inset 1px 0 0 rgba(240,179,92,.14),inset 0 0 20px rgba(0,0,0,.92);
}
::-webkit-scrollbar-thumb{
  border:2px solid transparent;border-radius:99px;background-clip:padding-box;
  background-image:linear-gradient(180deg,#FFDCAC 0%,#F0B35C 32%,#4ECB8D 74%,#63D8E8 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 0 10px rgba(240,179,92,.28);
}
::-webkit-scrollbar-thumb:hover{background-image:linear-gradient(180deg,#FFF3D6 0%,#FFC773 30%,#5BDD9C 72%,#8DEAF7 100%)}
::-webkit-scrollbar-thumb:active{background-image:linear-gradient(180deg,#FFE6BC 0%,#F0A64A 40%,#37B37A 100%)}
::-webkit-scrollbar-corner{background:#050907}

/* 鼠标：一只小黑猫（热点在左上爪尖） */
html,body,body *{cursor:url("assets/cat-cursor.png") 4 4,auto!important}
input,textarea,select{cursor:text!important}
</style>
<style id="skin-tap">
/* 禁止拖选 / 拖拽复制：整页文字不可被选中 */
html,body,body *{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable="true"]{-webkit-user-select:text;-moz-user-select:text;user-select:text}
img,a{-webkit-user-drag:none}

/* 进入站点后，任何一次点击都有光效 */
.tap-any{position:fixed;inset:0;z-index:240;pointer-events:none;overflow:hidden}
.tap-any .ta-grp{position:absolute;left:0;top:0;width:0;height:0}
.tap-any .ta-grp i{position:absolute;display:block;left:0;top:0}
.tap-any .ta-ring{width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
  border:1.5px solid rgba(255,232,196,.85);
  box-shadow:0 0 16px rgba(240,179,92,.6),inset 0 0 12px rgba(240,179,92,.35);
  animation:taRing .58s cubic-bezier(.16,.9,.3,1) forwards}
@keyframes taRing{0%{opacity:0;transform:scale(.35)}22%{opacity:1}100%{opacity:0;transform:scale(2.9)}}
.tap-any .ta-ring.s{width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-color:rgba(78,203,141,.85);
  box-shadow:0 0 14px rgba(78,203,141,.6);animation:taRingS .5s cubic-bezier(.16,.9,.3,1) .06s forwards}
@keyframes taRingS{0%{opacity:0;transform:scale(.3)}24%{opacity:1}100%{opacity:0;transform:scale(2.2)}}
.tap-any .ta-core{width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;
  background:radial-gradient(circle,#FFF8E8,#F0B35C 60%,rgba(240,179,92,0));
  box-shadow:0 0 18px 5px rgba(240,179,92,.42);animation:taCore .34s ease-out forwards}
@keyframes taCore{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(2.1)}}
.tap-any .ta-ray{width:1.5px;height:15px;margin:-15px 0 0 -.75px;border-radius:2px;
  background:linear-gradient(180deg,rgba(255,240,214,0),rgba(255,238,205,.9));
  transform-origin:50% 100%;animation:taRay .6s cubic-bezier(.16,.8,.3,1) forwards}
@keyframes taRay{0%{opacity:0;transform:rotate(var(--a)) translateY(-2px) scaleY(.25)}
  25%{opacity:.9}100%{opacity:0;transform:rotate(var(--a)) translateY(-92px) scaleY(1.1)}}
</style>

<div class="tap-any" id="tapAny" aria-hidden="true"></div>
<script>
(function(){
  /* 禁止拖拽图片 / 拖选产生的 ghost */
  document.addEventListener("dragstart", function(e){ e.preventDefault(); }, true);

  /* 进入站点后，任意点击都撒一圈光环 + 星针 */
  var wrap = document.getElementById("tapAny");
  if(!wrap) return;
  var boot = document.getElementById("boot");

  function fire(x, y){
    var g = document.createElement("div");
    g.className = "ta-grp";
    g.style.left = x + "px";
    g.style.top  = y + "px";
    var r1 = document.createElement("i"); r1.className = "ta-ring";
    var r2 = document.createElement("i"); r2.className = "ta-ring s";
    var co = document.createElement("i"); co.className = "ta-core";
    g.appendChild(r1); g.appendChild(r2); g.appendChild(co);
    for(var i = 0; i < 6; i++){
      var ry = document.createElement("i"); ry.className = "ta-ray";
      ry.style.setProperty("--a", (i * 60 + (Math.random() * 24 - 12)).toFixed(1) + "deg");
      ry.style.animationDelay = (Math.random() * 0.05).toFixed(3) + "s";
      g.appendChild(ry);
    }
    wrap.appendChild(g);
    setTimeout(function(){ if(g.parentNode) g.parentNode.removeChild(g); }, 780);
  }

  var last = 0;
  document.addEventListener("click", function(ev){
    if(boot && getComputedStyle(boot).display !== "none") return;  /* 开屏有自己的撕裂特效 */
    var now = Date.now();
    if(now - last < 80) return;
    last = now;
    fire(ev.clientX, ev.clientY);
  }, true);
})();
</script>
