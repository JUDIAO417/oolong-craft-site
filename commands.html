<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1">
<title>指令大全 · 乌龙茶的地盘</title>
<meta name="description" content="乌龙茶的地盘服务器指令大全：圈地、宠物、传送、领地等玩法指令速查。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='10' width='20' height='14' fill='%23F0B35C'/%3E%3Crect x='5' y='10' width='20' height='4' fill='%23E0933A'/%3E%3Crect x='25' y='14' width='4' height='6' fill='%23F0B35C'/%3E%3Crect x='29' y='16' width='2' height='2' fill='%23E0933A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Press+Start+2P&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#0E1612;--tea:#F0B35C;--tea-deep:#E0933A;--jade:#4ECB8D;--ink:#F2ECD9;
  --muted:#A9B5A6;--dim:#7C8A7F;--violet:#B78BFF;--aqua:#5FD4E8;--rose:#F97CB8;--blue:#6FA8FF;
  --glass-bg:rgba(20,28,24,.52);--glass-line:rgba(240,179,92,.16);--glass-line-strong:rgba(240,179,92,.38);
  --glass-hl:inset 0 1px 0 rgba(255,255,255,.08);--pixel:"Press Start 2P",monospace;--sans:"Noto Sans SC",system-ui,sans-serif;
  --r-sm:10px;--r-md:14px;--r-lg:20px;
  --shadow-glass:0 16px 44px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);color:var(--ink);line-height:1.75;min-height:100vh;
  background:
    radial-gradient(1100px 650px at 88% -8%,rgba(111,168,255,.10),transparent 60%),
    radial-gradient(900px 620px at -8% 32%,rgba(240,179,92,.10),transparent 55%),
    radial-gradient(760px 520px at 55% 115%,rgba(183,139,255,.09),transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
a{color:var(--tea);text-decoration:none}
/* 氛围光斑 */
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.ambient span{position:absolute;border-radius:50%;filter:blur(72px);animation:drift 22s ease-in-out infinite alternate}
.ambient span:nth-child(1){width:380px;height:380px;top:-120px;left:8%;background:radial-gradient(circle,rgba(78,203,141,.20),transparent 65%)}
.ambient span:nth-child(2){width:440px;height:440px;top:34%;right:-150px;background:radial-gradient(circle,rgba(183,139,255,.18),transparent 65%);animation-delay:-5s}
.ambient span:nth-child(3){width:400px;height:400px;bottom:-150px;left:30%;background:radial-gradient(circle,rgba(95,212,232,.15),transparent 65%);animation-delay:-10s}
@keyframes drift{to{transform:translateY(46px) scale(1.12)}}
/* 顶栏 */
header{position:sticky;top:0;z-index:50;background:rgba(14,22,18,.72);backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%);border-bottom:1px solid var(--glass-line);transition:background .3s,box-shadow .3s}
header.scrolled{background:rgba(14,22,18,.92);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.navbar{width:100%;max-width:none;padding:.9rem 24px;display:flex;align-items:center;justify-content:space-between;gap:1rem}  /* 导航真贴屏幕两边 */
.brand{display:flex;align-items:center;gap:.65rem;color:var(--ink)}
.brand b{font-family:var(--pixel);font-size:.78rem;color:var(--tea)}
.brand-en{font-size:.62rem;color:var(--dim);letter-spacing:.22em}
.nav-cta{display:flex;align-items:center;gap:.8rem}
.nav-cta a:not(.btn){font-size:.92rem;color:var(--muted);transition:color .2s}
.nav-cta a:not(.btn):hover{color:var(--tea)}
a.btn.btn-primary{color:#151006}   /* 保护按钮文字色，不被导航灰色规则覆盖 */
/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.7rem 1.25rem;border-radius:var(--r-sm);border:1px solid var(--glass-line-strong);font-size:.92rem;font-weight:600;cursor:pointer;transition:all .22s;position:relative;overflow:hidden;background:var(--glass-bg);color:var(--ink);font-family:var(--sans)}
.btn-primary{background:linear-gradient(135deg,rgba(247,183,92,.95),rgba(224,147,58,.85));color:#151006;border-color:rgba(232,226,212,.22);box-shadow:0 6px 20px rgba(240,179,92,.18)}
.btn-primary:hover{box-shadow:0 8px 26px rgba(240,179,92,.45);transform:translateY(-2px)}
.btn-ghost{background:var(--glass-bg);color:var(--ink);border-color:var(--glass-line-strong)}
.btn-ghost:hover{color:var(--tea);border-color:var(--tea);transform:translateY(-2px)}
.btn .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .65s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2.4);opacity:0}}
/* 主区 */
main{max-width:1080px;margin:0 auto;padding:clamp(2.6rem,6vw,4.4rem) 1.4rem clamp(3rem,7vw,5rem)}
.hero-head{text-align:center;margin-bottom:2.4rem}
.kicker{font-family:var(--pixel);font-size:.62rem;color:var(--jade);letter-spacing:.18em;display:inline-block;margin-bottom:1rem}
h1{font-size:clamp(1.7rem,4.4vw,2.6rem);line-height:1.3;margin-bottom:.7rem}
h1 em{font-style:normal;color:var(--tea)}
.hero-sub{color:var(--muted);max-width:620px;margin:0 auto;font-size:.98rem}
/* 搜索 */
.search{max-width:560px;margin:0 auto 2.6rem;position:relative}
.search input{width:100%;padding:.85rem 1.1rem .85rem 2.9rem;border-radius:var(--r-md);border:1px solid var(--glass-line-strong);background:var(--glass-bg);color:var(--ink);font-size:1rem;font-family:var(--sans);outline:none;transition:border-color .2s,box-shadow .2s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.search input:focus{border-color:var(--tea);box-shadow:0 0 0 3px rgba(240,179,92,.15)}
.search .mag{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.search .cnt{position:absolute;right:1rem;top:50%;transform:translateY(-50%);font-size:.78rem;color:var(--dim)}
/* 目录胶囊 */
.cats{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-bottom:2.8rem}
.cat-chip{font-family:var(--pixel);font-size:.56rem;padding:.55rem .95rem;border-radius:999px;border:1px solid var(--glass-line-strong);background:var(--glass-bg);color:var(--muted);cursor:pointer;transition:all .2s;line-height:1.5}
.cat-chip:hover{color:var(--tea);border-color:var(--tea)}
.cat-chip.on{background:linear-gradient(135deg,rgba(247,183,92,.9),rgba(224,147,58,.8));color:#151006;border-color:transparent}
/* 模块卡片 */
.mod-grid{display:grid;grid-template-columns:1fr;gap:1.5rem;align-items:start;max-width:860px;margin:0 auto}  /* 桌面单列：一行一个 mod，宽卡完整显示 */
.mod-card{height:100%;background:var(--glass-bg);border:1px solid var(--glass-line);border-radius:var(--r-lg);padding:1.4rem 1.5rem 1.2rem;backdrop-filter:blur(14px) saturate(120%);-webkit-backdrop-filter:blur(14px) saturate(120%);box-shadow:var(--shadow-glass);transition:transform .25s,box-shadow .25s;position:relative;overflow:hidden}
.mod-card::before{content:"";position:absolute;top:-46%;right:-30%;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(240,179,92,.12),transparent 65%);pointer-events:none}
.mod-card:hover{transform:translateY(-4px);box-shadow:0 22px 52px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.mod-head{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;border-bottom:1px solid var(--glass-line);padding:.2rem .1rem .7rem;cursor:pointer;user-select:none;position:relative}
.mod-head h2{font-size:1.18rem;color:var(--tea);margin:0;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 1.6rem)}  /* 名字独占一行，不换行，超长省略 */
.mod-head .c{font-family:var(--pixel);font-size:.5rem;color:var(--dim);letter-spacing:.1em}
.mod-body{overflow:hidden;max-height:14000px;transition:max-height .4s ease}
.mod-card.collapsed .mod-body{max-height:0}
.tog{position:absolute;top:.1rem;right:.1rem;background:none;border:none;color:var(--dim);cursor:pointer;padding:.2rem;display:flex;transition:transform .35s ease}
.mod-card.collapsed .tog{transform:rotate(-90deg)}
.mod-card.collapsed .mod-head{border-bottom-color:transparent}
.mod-head .c{font-family:var(--pixel);font-size:.5rem;color:var(--dim);letter-spacing:.1em}
.cmd-row{padding:.62rem 0;border-bottom:1px dashed rgba(240,179,92,.1);display:grid;grid-template-columns:auto 1fr;gap:.9rem;align-items:baseline}
.cmd-row:last-child{border-bottom:none}
.cmd{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;font-size:.86rem;color:var(--aqua);background:rgba(95,212,232,.08);border:1px solid rgba(95,212,232,.16);border-radius:var(--r-sm);padding:.22rem .6rem;white-space:nowrap;line-height:1.6}
.mod-card h2{font-size:1.2rem}
.cmd-row{grid-template-columns:max-content 1fr}  /* 指令自适应宽，说明占满剩余 */
.cmd-desc{color:var(--muted);font-size:.9rem}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:3rem 0}
.empty b{color:var(--tea)}
footer{margin-top:2rem;padding:2.2rem 1.4rem;text-align:center;color:var(--dim);font-size:.85rem;border-top:1px solid var(--glass-line)}
footer a{color:var(--tea)}
@media(max-width:640px){
  .navbar{padding:.75rem 1rem}
  .brand b{font-size:.66rem}
  .brand-en{font-size:.5rem}
  .hero-sub{font-size:.9rem}
  /* 手机端双列紧凑卡：一屏可看到多个模组，避免一屏只显示一张大卡 */
  .mod-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;align-items:stretch}  /* 双列等高：长短卡对齐更整齐 */
  .mod-grid.single{grid-template-columns:1fr;max-width:none}  /* 选中单个分类：单列占满居中 */
  .mod-card{padding:.95rem .8rem .8rem}
  .mod-head h2{font-size:1rem}
  .mod-head .c{font-size:.45rem}
  .mod-head{padding:.15rem .1rem .55rem;gap:.3rem}
  .cmd-row{grid-template-columns:1fr;gap:.25rem;padding:.5rem 0}
  .cmd{font-size:.72rem;white-space:normal;word-break:break-all;padding:.15rem .45rem;line-height:1.55}
  .mod-grid{max-width:none}
  .cmd-desc{font-size:.76rem;line-height:1.6}
  .cats{gap:.45rem;margin-bottom:2rem}
  .cat-chip{font-size:.48rem;padding:.45rem .7rem}
  .search{margin-bottom:2rem}
}
</style>
</head>
<body>
<div class="ambient"><span></span><span></span><span></span></div>

<header>
  <div class="navbar">
    <a class="brand" href="index.html">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="10" width="20" height="14" fill="#F0B35C"/><rect x="5" y="10" width="20" height="4" fill="#E0933A"/><rect x="25" y="14" width="4" height="6" fill="#F0B35C"/><rect x="29" y="16" width="2" height="2" fill="#E0933A"/></svg>
      <span><b>乌龙茶的地盘</b><br><span class="brand-en">COMMAND GUIDE</span></span>
    </a>
    <div class="nav-cta">
      <a href="index.html">返回官网</a>
      <a class="btn btn-primary" href="download.html">获取客户端</a>
    </div>
  </div>
</header>

<main>
  <div class="hero-head">
    <h1>玩法指令 <em>速查手册</em></h1>
    <p class="hero-sub">按玩法模块整理服务器常用指令。输入关键词可以快速搜索；点上面的标签可以只看某一类。</p>
  </div>

  <div class="search">
    <span class="mag" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    </span>
    <input id="q" type="search" placeholder="搜索指令，如 /res 或 圈地…" autocomplete="off">
    <span class="cnt" id="cnt"></span>
  </div>

  <div class="cats" id="cats"></div>

  <div class="mod-grid" id="grid"></div>
</main>

<footer>
  乌龙茶的地盘 · OOLONG CRAFT —— 指令随服务器版本更新，一切以进服公告为准。<br>
  <a href="index.html">返回首页</a> · <a href="download.html">下载客户端</a>
</footer>

<script>
var DATA=[
  {"cat":"圈地","items":[
    {"cmd":"/res create 名字","desc":"把选中的区域圈成你的领地"},
    {"cmd":"/res select x1 z1 x2 z2","desc":"用坐标框选一块区域"},
    {"cmd":"/res remove 名字","desc":"删除自己的领地"},
    {"cmd":"/res ps 名字 玩家名","desc":"把某个玩家添加为领地成员"}
  ]},
  {"cat":"宠物","items":[
    {"cmd":"/pet spawn","desc":"召唤你的宠物（示例，待补充）"},
    {"cmd":"/pet info","desc":"查看宠物信息（示例，待补充）"},
    {"cmd":"/pet release","desc":"放生宠物（示例，待补充）"}
  ]},
  {"cat":"传送","items":[
    {"cmd":"/home","desc":"回到自己设置的出生点（示例，待补充）"},
    {"cmd":"/sethome","desc":"设置个人出生点（示例，待补充）"},
    {"cmd":"/tpa 玩家名","desc":"请求传送到某玩家身边（示例，待补充）"}
  ]}
];
var ALL=[].concat(DATA), CAT="", qEl=document.getElementById("q"), grid=document.getElementById("grid"), catsEl=document.getElementById("cats"), cntEl=document.getElementById("cnt");

function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
function render(){
  var kw=qEl.value.trim().toLowerCase();
  var list=ALL.filter(function(m){ if(CAT && m.cat!==CAT) return false; if(!kw) return true;
    return m.cat.toLowerCase().indexOf(kw)>=0 || m.items.some(function(it){ return it.cmd.toLowerCase().indexOf(kw)>=0 || it.desc.toLowerCase().indexOf(kw)>=0; });
  });
  var cats=[];
  ALL.forEach(function(m){ if(cats.indexOf(m.cat)<0) cats.push(m.cat); });
  catsEl.innerHTML=cats.map(function(c){
    return '<button class="cat-chip'+(CAT===c?" on":"")+'" data-c="'+esc(c)+'">《'+esc(c)+'》</button>';
  }).join("");
  catsEl.querySelectorAll("[data-c]").forEach(function(b){
    b.addEventListener("click",function(){
      CAT=(CAT===b.getAttribute("data-c")?"":b.getAttribute("data-c"));
      render();
    });
  });
  var n=0;
  var arrow='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  grid.innerHTML=list.map(function(m){
    n+=m.items.length;
    return '<div class="mod-card collapsed"><div class="mod-head"><h2>《'+esc(m.cat)+'》</h2><span class="c">'+m.items.length+' 条指令</span><button class="tog" aria-label="展开收起">'+arrow+'</button></div><div class="mod-body">'+
      m.items.map(function(it){
        return '<div class="cmd-row"><code class="cmd">'+esc(it.cmd)+'</code><span class="cmd-desc">'+esc(it.desc)+'</span></div>';
      }).join('')+'</div></div>';
  }).join("") || '<div class="empty">没有找到匹配的指令。<br><br><b>换个关键词试试？</b></div>';
  grid.querySelectorAll(".mod-head").forEach(function(h){
    h.addEventListener("click",function(){ h.parentElement.classList.toggle("collapsed"); });
  });
  if(q||CAT){   /* 搜索或筛选时自动展开，避免内容被折叠挡住 */
    grid.querySelectorAll(".mod-card.collapsed").forEach(function(c){ c.classList.remove("collapsed"); });
  }
  grid.classList.toggle("single", list.length===1 && !!CAT);  /* 手机端单分类占满整行 */
  cntEl.textContent=(list.length? n+" 条":"");
}
qEl.addEventListener("input",render);
render();

/* 数据优先从本站镜像实时读取，失败时使用内置示例 */
fetch("https://judiao417.github.io/oolong-craft-site/commands.json?t="+Date.now(),{cache:"no-store"})
  .then(function(r){ if(!r.ok) throw new Error(String(r.status)); return r.json(); })
  .then(function(d){
    if(d && d.length){ ALL=d; render(); }
  })
  .catch(function(){});
</script>
</body>
</html>
