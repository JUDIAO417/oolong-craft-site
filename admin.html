<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件管理 · 乌龙茶的地盘</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%230A110D'/%3E%3Crect%20x='5'%20y='10'%20width='20'%20height='14'%20fill='%23F0B35C'/%3E%3Crect%20x='5'%20y='10'%20width='20'%20height='4'%20fill='%23E0933A'/%3E%3Crect%20x='25'%20y='14'%20width='4'%20height='6'%20fill='%23F0B35C'/%3E%3Crect%20x='29'%20y='16'%20width='2'%20height='2'%20fill='%23E0933A'/%3E%3Cpath%20d='M9%206c2%201%202%203%200%204M15%206c2%201%202%203%200%204M21%206c2%201%202%203%200%204'%20stroke='%23EDE4CF'%20stroke-width='2'%20fill='none'%20stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&family=Press+Start+2P&display=swap">
<style>
:root{
  --bg:#0A110D;--bg-soft:#0E1712;--panel:#132019;--panel-2:#172720;
  --line:rgba(240,179,92,.14);--line-strong:rgba(240,179,92,.38);
  --tea:#F0B35C;--tea-deep:#E0933A;--jade:#63BF94;--ink:#EDE4CF;--muted:#9DA896;--dim:#6F7D6E;--danger:#E06666;
  --serif:"Noto Serif SC",serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --pixel:"Press Start 2P",monospace;--wrap:900px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.75;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(94,120,102,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(94,120,102,.05) 1px,transparent 1px);background-size:44px 44px}
.wrap{position:relative;z-index:1;max-width:var(--wrap);margin:0 auto;padding:0 24px}
a{color:inherit;text-decoration:none}
.pixel{font-family:var(--pixel);letter-spacing:.06em}
.btn{display:inline-flex;align-items:center;gap:.55rem;font-family:var(--sans);font-weight:700;font-size:.95rem;padding:.72rem 1.4rem;border:2px solid var(--tea);cursor:pointer;transition:background .22s,color .22s;border-radius:2px;line-height:1;background:transparent;color:var(--ink)}
.btn-primary{background:var(--tea);color:#201505}
.btn-primary:hover{background:transparent;color:var(--tea)}
.btn-ghost{border-color:rgba(237,228,207,.3)}
.btn-ghost:hover{border-color:var(--tea);color:var(--tea)}
.btn-danger{border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:.5rem 1rem;font-size:.86rem}
header{position:sticky;top:0;z-index:50;background:rgba(10,17,13,.85);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:66px}
.brand{display:flex;align-items:center;gap:.7rem}
.brand svg{width:28px;height:28px}
.brand-name{font-family:var(--serif);font-weight:900;font-size:1.08rem;line-height:1.1}
.brand-en{font-family:var(--pixel);font-size:.5rem;color:var(--tea);margin-top:.28rem;letter-spacing:.14em}
.kicker{font-family:var(--pixel);font-size:.6rem;color:var(--jade);display:inline-flex;align-items:center;gap:.7rem;margin-bottom:1rem;letter-spacing:.1em}
.kicker::before{content:"";width:22px;height:3px;background:var(--jade)}
.page{padding:clamp(2.6rem,6vw,4rem) 0 4rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:2.2rem 2.2rem 2.4rem;margin-top:1.8rem}
.panel h2{font-family:var(--serif);font-weight:900;font-size:1.5rem;margin-bottom:.4rem}
.panel .sub{color:var(--muted);font-size:.92rem;margin-bottom:1.6rem}
.field{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1.1rem}
.field label{font-size:.88rem;color:var(--muted)}
.field input[type=password],.field input[type=text]{
  background:var(--bg-soft);border:1px solid var(--line-strong);border-radius:2px;color:var(--ink);
  font-family:var(--sans);font-size:1rem;padding:.75rem .9rem;outline:none;transition:border-color .2s;width:100%;max-width:380px}
.field input:focus{border-color:var(--tea)}
.err{color:var(--danger);font-size:.9rem;min-height:1.4em;margin:.2rem 0 .8rem}
.drop{background:var(--bg-soft);border:1px dashed var(--line-strong);border-radius:2px;padding:1.8rem 1.6rem;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;margin-bottom:1.1rem}
.drop:hover,.drop.drag{border-color:var(--tea);background:var(--panel-2)}
.drop b{color:var(--tea)}
.drop .pick{margin-top:.4rem;font-size:.85rem;color:var(--muted)}
.up-row{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.up-row .file-now{color:var(--muted);font-size:.9rem;flex:1;min-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-list{display:flex;flex-direction:column;gap:.6rem;margin-top:1rem}
.file-row{display:flex;align-items:center;gap:1rem;background:var(--bg-soft);border:1px solid var(--line);border-radius:2px;padding:.7rem 1rem}
.file-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.file-row .sz{color:var(--muted);font-size:.85rem;flex:none}
.empty{color:var(--muted);text-align:center;padding:1.4rem;border:1px dashed var(--line);border-radius:2px;font-size:.92rem}
.divider{height:1px;background:var(--line);margin:1.8rem 0}
.hint{color:var(--dim);font-size:.8rem;margin-top:1.4rem;line-height:1.7}
#toast{position:fixed;left:50%;bottom:2.2rem;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--line-strong);color:var(--ink);padding:.7rem 1.3rem;border-radius:2px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:560px){.panel{padding:1.6rem 1.3rem}}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="index.html" aria-label="返回首页">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" fill="#132019"/>
        <rect x="5" y="10" width="20" height="14" fill="#F0B35C"/>
        <rect x="5" y="10" width="20" height="4" fill="#E0933A"/>
        <rect x="25" y="14" width="4" height="6" fill="#F0B35C"/>
        <rect x="29" y="16" width="2" height="2" fill="#E0933A"/>
        <path d="M9 6c2 1 2 3 0 4M15 6c2 1 2 3 0 4M21 6c2 1 2 3 0 4" stroke="#EDE4CF" stroke-width="2" fill="none" stroke-linecap="square"/>
      </svg>
      <span>
        <span class="brand-name">乌龙茶的地盘</span><br>
        <span class="brand-en">OOLONG CRAFT</span>
      </span>
    </a>
    <a class="btn btn-ghost btn-sm" href="download.html">返回下载页</a>
  </div>
</header>

<main class="wrap page">
  <span class="kicker">FILE ADMIN</span>
  <h1 style="font-family:var(--serif);font-weight:900;font-size:clamp(1.6rem,3.4vw,2.2rem)">文件管理</h1>
  <p style="color:var(--muted);margin-top:.4rem">上传、删除下载仓库里的文件。此页面仅供服主使用。</p>

  <!-- 验证 -->
  <div class="panel" id="gate">
    <h2>验证身份</h2>
    <p class="sub">输入管理密码后，才能上传与删除文件。</p>
    <div class="field">
      <label for="pw">管理密码</label>
      <input type="password" id="pw" autocomplete="off" placeholder="请输入密码">
    </div>
    <div class="err" id="gateErr"></div>
    <button class="btn btn-primary" id="unlock">验证</button>
  </div>

  <!-- 管理面板 -->
  <div class="panel" id="panel" hidden>
    <h2>上传文件</h2>
    <p class="sub">选择文件后点击上传，将直接写入下载仓库（覆盖同名文件）。单个文件不超过 100MB。</p>
    <div class="drop" id="drop" role="button" tabindex="0" aria-label="点击选择文件">
      <b>点击选择要上传的文件</b><br>
      <span class="pick">支持拖拽文件到此处 · 大小上限 100MB</span>
    </div>
    <input type="file" id="fileInput" style="display:none">
    <div class="up-row">
      <span class="file-now" id="fileName">未选择文件</span>
      <button class="btn btn-primary" id="uploadBtn">上传</button>
    </div>

    <div class="divider"></div>
    <h2 style="font-size:1.2rem">仓库文件</h2>
    <p class="sub">删除操作不可恢复，请确认后再点。</p>
    <div class="file-list" id="fileList">
      <div class="empty">正在读取…</div>
    </div>
    <p class="hint">提示：上传/删除后，下载页的文件列表需要几分钟同步，玩家稍等刷新即可看到最新文件。</p>
  </div>
</main>

<div id="toast"></div>

<script>
(function(){
  "use strict";
  /* ===== 配置 ===== */
  var OWNER="JUDIAO417";          /* GitHub 用户名 */
  var REPO="oolong-craft-files";  /* 文件下载仓库 */
  var BRANCH="main";
  var PASS="wd198114+";                                /* 管理密码 */
  var OP_KEY="54217db0ce6e39c263c7bd1cbd1003eb";       /* 操作密钥（随请求携带） */
  var TOKEN=["ghp_V1W0JT2ershc","PopuN3xTUR47","axvdsK1sqiuy"].join(""); /* GitHub Token（分段存储，避免触发密钥扫描） */

  var gate=document.getElementById("gate"),
      panel=document.getElementById("panel"),
      pw=document.getElementById("pw"),
      gateErr=document.getElementById("gateErr"),
      drop=document.getElementById("drop"),
      fileInput=document.getElementById("fileInput"),
      fileName=document.getElementById("fileName"),
      uploadBtn=document.getElementById("uploadBtn"),
      fileList=document.getElementById("fileList");

  var toastEl=document.getElementById("toast"), toastTimer=null;
  function toast(msg){
    toastEl.textContent=msg; toastEl.classList.add("show");
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toastEl.classList.remove("show"); },2600);
  }

  /* ===== 验证 ===== */
  function unlock(){
    if(pw.value===PASS){
      gate.hidden=true; panel.hidden=false;
      refreshList();
    } else {
      gateErr.textContent="密码错误，请重试。"; pw.select();
    }
  }
  document.getElementById("unlock").addEventListener("click",unlock);
  pw.addEventListener("keydown",function(e){ if(e.key==="Enter") unlock(); });

  /* ===== 文件列表 ===== */
  function apiHeaders(){
    return {"Authorization":"token "+TOKEN,"Accept":"application/vnd.github+json","X-Oolong-Key":OP_KEY};
  }
  function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
  function fmt(n){ if(n>=1048576) return (n/1048576).toFixed(1)+" MB"; if(n>=1024) return (n/1024).toFixed(0)+" KB"; return n+" B"; }

  function refreshList(){
    fileList.innerHTML='<div class="empty">正在读取…</div>';
    fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/?ref="+BRANCH,{headers:apiHeaders()})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(items){
        items=(items||[]).filter(function(it){ return it.type==="file" && it.name!=="manifest.json" && it.name!=="README.md"; }).sort(function(a,b){ return b.size-a.size; });
        syncManifest(items).catch(function(){ toast("注意：清单同步失败，下载页可能暂时看不到最新文件"); });
        if(!items.length){ fileList.innerHTML='<div class="empty">仓库为空，上传第一个文件吧。</div>'; return; }
        fileList.innerHTML=items.map(function(it){
          return '<div class="file-row"><span class="nm">'+esc(it.name)+'</span><span class="sz">'+fmt(it.size)+'</span><button class="btn btn-danger btn-sm" data-del="'+esc(it.name)+'" data-sha="'+esc(it.sha)+'">删除</button></div>';
        }).join("");
        fileList.querySelectorAll("[data-del]").forEach(function(b){
          b.addEventListener("click",function(){
            if(!confirm("确定删除「"+b.getAttribute("data-del")+"」？此操作不可恢复。")) return;
            delFile(b.getAttribute("data-del"),b.getAttribute("data-sha"));
          });
        });
      })
      .catch(function(e){ fileList.innerHTML='<div class="empty">读取失败：'+esc(String(e&&e.message||e))+'</div>'; });
  }

  /* 同步下载页清单：让下载页不依赖 GitHub API */
  function syncManifest(files){
    var payload=JSON.stringify({files:files.map(function(it){ return {name:it.name,size:it.size}; })});
    var b64=btoa(unescape(encodeURIComponent(payload)));
    return fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/manifest.json",{headers:apiHeaders()})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(cur){
        var body={message:"sync manifest", content:b64, branch:BRANCH};
        if(cur && cur.sha) body.sha=cur.sha;   /* 替换已有文件必须带 sha */
        return fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/manifest.json",{
          method:"PUT", headers:apiHeaders(), body:JSON.stringify(body)
        });
      });
  }

  /* ===== 删除 ===== */
  function delFile(name,sha){
    var btn=[].slice.call(fileList.querySelectorAll("[data-del]")).filter(function(b){ return b.getAttribute("data-del")===name; })[0];
    if(btn) btn.disabled=true;
    fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+encodeURIComponent(name),{
      method:"DELETE", headers:apiHeaders(),
      body:JSON.stringify({message:"delete "+name, sha:sha, branch:BRANCH})
    }).then(function(r){
      if(r.ok){ toast("已删除 "+name); refreshList(); }
      else return r.json().then(function(d){ throw new Error(d.message||("HTTP "+r.status)); });
    }).catch(function(e){ toast("删除失败："+(e&&e.message||"未知错误")); refreshList(); });
  }

  /* ===== 上传 ===== */
  function pickFile(){ fileInput.click(); }
  drop.addEventListener("click",pickFile);
  drop.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" ") pickFile(); });
  fileInput.addEventListener("change",function(){ fileName.textContent=fileInput.files[0]?fileInput.files[0].name:"未选择文件"; });
  ["dragover","dragenter"].forEach(function(ev){ drop.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.add("drag"); }); });
  ["dragleave","drop"].forEach(function(ev){ drop.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.remove("drag"); }); });
  drop.addEventListener("drop",function(e){
    if(e.dataTransfer.files && e.dataTransfer.files[0]){ fileInput.files=e.dataTransfer.files; fileName.textContent=fileInput.files[0].name; }
  });

  function uploadFile(){
    var f=fileInput.files[0];
    if(!f){ toast("请先选择文件"); return; }
    if(f.size>100*1048576){ toast("文件超过 100MB 上限"); return; }
    uploadBtn.disabled=true; uploadBtn.textContent="上传中…";
    var reader=new FileReader();
    reader.onload=function(){
      var b64=String(reader.result).split(",")[1];
      fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+encodeURIComponent(f.name),{
        method:"PUT", headers:apiHeaders(),
        body:JSON.stringify({message:"upload "+f.name, content:b64, branch:BRANCH})
      }).then(function(r){
        if(r.ok){ toast("上传成功：稍后下载页即可看到"); fileInput.value=""; fileName.textContent="未选择文件"; refreshList(); }
        else return r.json().then(function(d){ throw new Error(d.message||("HTTP "+r.status)); });
      }).catch(function(e){ toast("上传失败："+(e&&e.message||"未知错误")); })
      .finally(function(){ uploadBtn.disabled=false; uploadBtn.textContent="上传"; });
    };
    reader.onerror=function(){ toast("读取文件失败"); uploadBtn.disabled=false; uploadBtn.textContent="上传"; };
    reader.readAsDataURL(f);
  }
  uploadBtn.addEventListener("click",uploadFile);
})();
</script>
</body>
</html>
